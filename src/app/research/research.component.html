<section id="research" class="min-h-screen pt-20 pb-10">
  <div class="container mx-auto mt-4">

    <!-- Section Title -->
    <div class="text-4xl md:text-6xl font-bold text-center pb-16">
      <span [class]="gradientColorClass">Research</span>
    </div>

    <!-- Research Interests -->
    <div class="mb-16">
      <h3 class="text-3xl md:text-4xl font-bold text-center mb-10
                 bg-gradient-to-r from-yellow-400 via-fuchsia-400 to-pink-500
                 bg-clip-text text-transparent">
        Research Interests
      </h3>

      <div class="flex flex-wrap items-center justify-center gap-3 px-6 md:px-10">
        <span *ngFor="let interest of researchInterests"
              class="text-sm font-medium font-mono px-4 py-2 rounded-full
                     dark:bg-gray-100 bg-white/[0.04]
                     dark:border-gray-200 border-white/10 border
                     dark:text-gray-700 text-white/80
                     dark:hover:border-fuchsia-400/60 hover:border-fuchsia-400/40
                     dark:hover:bg-gray-50 hover:bg-white/[0.07]
                     dark:hover:text-fuchsia-600 hover:text-yellow-400/90
                     transition-all duration-200 cursor-default">
          {{ interest }}
        </span>
      </div>
    </div>

    <!-- Divider -->
    <div class="h-px w-full bg-gradient-to-r
                from-transparent dark:via-gray-300 via-white/10 to-transparent
                mb-16"></div>

    <!-- Publications -->
    <div>
      <h3 class="text-3xl md:text-4xl font-bold text-center mb-10
                 bg-gradient-to-r from-yellow-400 via-fuchsia-400 to-pink-500
                 bg-clip-text text-transparent">
        Publications
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 px-6 md:px-10 py-4">
        <div *ngFor="let publication of publicationsList; let i = index"
             class="relative
                    dark:bg-gray-100 bg-white/[0.04]
                    dark:border-gray-200 border-white/10 border
                    rounded-2xl p-6 flex flex-col gap-3 overflow-hidden
                    transition-all duration-300 hover:-translate-y-1.5
                    dark:hover:border-fuchsia-400/50 hover:border-fuchsia-400/30
                    dark:hover:bg-gray-50 hover:bg-white/[0.07]">

          <!-- top gradient bar -->
          <div class="absolute top-0 left-0 right-0 h-[3px] rounded-t-2xl
                      bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 opacity-70"></div>

          <!-- pub number -->
          <span class="text-[11px] font-medium tracking-[1.5px] uppercase font-mono
                       dark:text-yellow-600 text-yellow-400/60 mt-1">
            Publication // {{ i + 1 < 10 ? '0' + (i + 1) : (i + 1) }}
          </span>

          <!-- title -->
          <h4 class="text-[16px] font-bold dark:text-gray-800 text-white/90
                     leading-snug line-clamp-3">
            {{ publication.title }}
          </h4>

          <!-- authors -->
          <p class="text-[12px] font-mono dark:text-gray-400 text-white/40 truncate">
            {{ publication.authors }}
          </p>

          <!-- journal + year chip -->
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full italic
                         dark:bg-fuchsia-400/20 bg-fuchsia-400/10
                         dark:text-fuchsia-700 text-fuchsia-300/80
                         dark:border-fuchsia-400/30 border-fuchsia-400/20 border">
              {{ publication.journal }}
            </span>
            <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full font-mono
                         dark:bg-yellow-400/20 bg-yellow-400/10
                         dark:text-yellow-700 text-yellow-400/80
                         dark:border-yellow-500/30 border-yellow-400/20 border">
              {{ publication.year }}
            </span>
          </div>

          <!-- spacer -->
          <div class="flex-1"></div>

          <!-- footer -->
          <div class="pt-3 mt-1 dark:border-gray-200 border-white/[0.07] border-t">
            <a [href]="publication.link" target="_blank"
               class="inline-flex items-center gap-1.5 text-[12px] font-semibold
                      px-3.5 py-1.5 rounded-lg no-underline
                      dark:border-gray-300 border-white/15 border
                      dark:text-gray-600 text-white/70
                      dark:bg-white bg-white/5
                      dark:hover:border-yellow-500 hover:border-yellow-400/40
                      dark:hover:text-yellow-600 hover:text-yellow-400
                      transition-all duration-200">
              ↗ Read Paper
            </a>
          </div>

        </div>
      </div>
    </div>

  </div>
</section>
