<section id="projects" class="min-h-screen pt-20">
  <div class="container mx-auto mt-4">
    <div class="text-4xl md:text-6xl font-bold text-center pb-16">
      <span [class]="gradientColorClass">Projects</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 px-6 md:px-10 py-4">
      <div *ngFor="let project of projectsList; let i = index"
           class="relative
                  dark:bg-gray-100 bg-white/[0.04]
                  dark:border-gray-200 border-white/10 border
                  rounded-2xl p-6 flex flex-col gap-3 overflow-hidden
                  transition-all duration-300 hover:-translate-y-1.5
                  dark:hover:border-fuchsia-400/50 hover:border-fuchsia-400/30
                  dark:hover:bg-gray-50 hover:bg-white/[0.07]">

        <!-- top gradient bar -->
        <div class="absolute top-0 left-0 right-0 h-[3px] rounded-t-2xl
                    bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 opacity-70"></div>

        <!-- project number -->
        <span class="text-[11px] font-medium tracking-[1.5px] uppercase font-mono
                     dark:text-yellow-600 text-yellow-400/60 mt-1">
          Project // {{ i + 1 < 10 ? '0' + (i + 1) : (i + 1) }}
        </span>

        <!-- title -->
        <div class="text-[17px] font-bold dark:text-gray-800 text-white/90 truncate">
          {{ project.title }}
        </div>

        <!-- tech chips -->
        <div class="flex flex-wrap gap-1.5">
          <span *ngFor="let t of project.technologies"
                class="text-[11px] font-medium font-mono px-2.5 py-0.5 rounded-full
                       dark:bg-yellow-400/20 bg-yellow-400/10
                       dark:text-yellow-700 text-yellow-400/85
                       dark:border-yellow-500/30 border-yellow-400/20 border">
            {{ t }}
          </span>
        </div>

        <!-- description -->
        <p class="text-[13px] dark:text-gray-500 text-white/50 leading-relaxed flex-1">
          {{ project.description }}
        </p>

        <!-- footer links -->
        <div class="flex items-center justify-between pt-3 mt-1
                    dark:border-gray-200 border-white/[0.07] border-t">

          <a [href]="project.link" target="_blank"
             class="text-[12px] font-semibold px-3.5 py-1.5 rounded-lg no-underline
                    dark:border-gray-300 border-white/15 border
                    dark:text-gray-600 text-white/70
                    dark:bg-white bg-white/5
                    dark:hover:border-yellow-500 hover:border-yellow-400/40
                    dark:hover:text-yellow-600 hover:text-yellow-400
                    transition-all duration-200">
            ⌥ View Code
          </a>

          <a [href]="project.live || '#'" target="_blank"
             class="text-[12px] font-semibold px-3.5 py-1.5 rounded-lg no-underline
                    dark:border-gray-300 border-white/15 border
                    dark:text-gray-600 text-white/70
                    dark:bg-white bg-white/5
                    dark:hover:border-yellow-500 hover:border-yellow-400/40
                    dark:hover:text-yellow-600 hover:text-yellow-400
                    transition-all duration-200"
             [class.opacity-25]="!project.live"
             [class.pointer-events-none]="!project.live">
            ⚡ Live Demo
          </a>

        </div>
      </div>
    </div>
  </div>
</section>
