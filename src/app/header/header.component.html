<header class="sticky top-0 backdrop-blur-md text-white py-4 px-4 md:px-6 z-50 dark:bg-[#8AAAE5]/40 bg-black/25">
  <nav class="container mx-auto flex justify-between items-center">
    <a href="#" class="text-3xl font-satisfy font-bold dark:text-black">Pranta <span
      [class]="gradientColorClass">Nath</span></a>

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn text-[#a7aeb8] bg-[#191e24] md:hidden" (click)="toggleDropdown()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </div>

      <ul
        [ngClass]="{'hidden': !isMenuOpen, 'flex': isMenuOpen}"
        tabindex="0"
        class="dropdown-content menu menu-sm bg-[#191e24] rounded-box z-[1] w-52 p-2 flex flex-col items-center gap-y-2"
      >
        <li><a href="#about" class="link" (click)="closeDropdown()">About</a></li>
        <li><a href="#education" class="link" (click)="closeDropdown()">Education</a></li>
        <li><a href="#skills" class="link" (click)="closeDropdown()">Skills</a></li>
        <li><a href="#achievements" class="link" (click)="closeDropdown()">Achievements</a></li>
        <li><a href="#projects" class="link" (click)="closeDropdown()">Projects</a></li>
        <li><a href="#research" class="link" (click)="closeDropdown()">Research</a></li>
        <div>
          <app-dark-mode></app-dark-mode>
        </div>
      </ul>
    </div>
    <div class="hidden md:flex">
      <ul class="hidden md:flex space-y-0 md:space-x-1 font-semibold md:flex-row items-center mt-4 md:mt-0">

        <li *ngFor="let item of ['about','education','skills','achievements','projects','research']">
          <a [href]="'#' + item"
             class="relative px-4 py-2 rounded-lg text-sm
              dark:text-gray-600 text-white/70
             transition-all duration-200 capitalize
              group overflow-hidden inline-block">

            <!-- animated underline -->
            <span class="absolute bottom-1 left-4 right-4 h-[1.5px] rounded-full
                   bg-gradient-to-r from-pink-400 via-fuchsia-400 to-red-500
                   scale-x-0 group-hover:scale-x-100
                   transition-transform duration-300 origin-left">
      </span>

            {{ item }}
          </a>
        </li>

        <!-- dark mode toggle -->
        <li class="pl-3">
          <app-dark-mode/>
        </li>

      </ul>
    </div>

  </nav>

</header>
